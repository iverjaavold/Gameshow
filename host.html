<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e27" />
  <title>Gameshow – hovedskjerm</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/host.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600;700;800;900&display=swap" />
</head>

<body class="host">
  <header class="topbar">
    <div class="brand">GAMESHOW</div>
    <div class="code-box">
      <span class="muted">Kode</span>
      <strong id="code"></strong>
    </div>
    <button id="share-button" class="secondary small">🔗 Del lenke</button>
    <span id="test-badge" class="test-badge hidden">TESTMODUS</span>
    <div id="round-label" class="round-label"></div>
    <button id="feedback-button" class="secondary small">Tilbakemelding</button>
    <div id="connection" class="connection"></div>
  </header>

  <div id="feed" class="feed"></div>
  <main id="stage" class="stage"></main>
  <section id="board" class="board"></section>
  <nav id="controls" class="controls"></nav>
  <div id="planner" class="planner hidden"></div>

  <script src="js/qrcode.js"></script>
  <script src="js/common.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
