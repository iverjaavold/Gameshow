<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e27" />
  <title>Gameshow</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600;700;800;900&display=swap" />
</head>

<body>
  <section class="landing-screen">
    <div class="landing-card">
      <h1>Gameshow</h1>
      <p class="landing-subtitle">by Iver A. N. J</p>

      <form id="join-form" class="landing-actions">
        <label for="code-input" class="muted">Har du fått en kode?</label>
        <div class="row">
          <input id="code-input" class="grow code-input" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="KODE" />
          <button type="submit">Bli med</button>
        </div>
      </form>

      <div class="landing-divider"><span>eller</span></div>

      <button id="host-button" class="secondary">Lag nytt spill på hovedskjermen</button>
      <p id="landing-error" class="error-text"></p>

      <button id="feedback-button" type="button" class="feedback-link">Gi tilbakemelding (bugg eller idé)</button>
    </div>
  </section>

  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
